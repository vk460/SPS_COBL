<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Teacher</title>

    <link rel="stylesheet" href="/static/css/site.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f5f8ff;
            --surface: #fff;
            --border: #e5eaf2;
            --ink: #17243b;
            --muted: #78869b;
            --blue: #245eea;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0 !important;
            padding: 40px 24px !important;
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at 86% 5%, rgba(196, 218, 255, .36), transparent 32%), var(--page-bg) !important;
            color: var(--ink) !important;
            font-family: "DM Sans", "Segoe UI", sans-serif !important;
        }

        .assign-page {
            width: min(660px, 100%);
        }

        .assign-card {
            padding: 38px !important;
            border: 1px solid var(--border) !important;
            border-radius: 18px !important;
            background: var(--surface) !important;
            box-shadow: 0 18px 48px rgba(34, 57, 97, .09) !important;
            animation: arrive .45s ease-out both;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .assign-card h1 {
            margin: 0 0 28px;
            color: var(--ink) !important;
            font: 800 28px/1.25 "Manrope", sans-serif;
            text-align: center;
        }

        .course-info {
            margin-bottom: 28px;
            padding: 16px 18px;
            border: 1px solid #e4ebf7;
            border-radius: 10px;
            background: #f7f9fd;
            color: #34435b;
            font-size: 15px;
            line-height: 1.8;
        }

        .course-info b {
            color: var(--blue);
        }

        .assign-card label {
            display: block;
            margin-bottom: 8px;
            color: #45546c;
            font-size: 14px;
            font-weight: 700;
        }

        .assign-card select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d9e2ef !important;
            border-radius: 8px !important;
            background: #fff !important;
            color: var(--ink) !important;
            font: 500 15px "DM Sans", sans-serif;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .assign-page .btn-primary,
        .assign-page .cancel-link {
            min-height: 44px;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: 9px;
            font: 700 14px "DM Sans", sans-serif;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
        }

        .assign-page .btn-primary {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 5px 13px rgba(36, 94, 234, .18);
        }

        .assign-page .btn-primary:hover {
            background: #1747bf;
            box-shadow: 0 8px 18px rgba(36, 94, 234, .22);
        }

        .assign-page .cancel-link {
            border-color: #d9e2ef;
            background: #fff;
            color: #45546c;
        }

        .assign-page .cancel-link:hover {
            background: #f5f7fb;
        }

        .assign-page .btn-primary:hover,
        .assign-page .cancel-link:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 520px) {
            body { padding: 20px 14px !important; }
            .assign-card { padding: 24px 18px !important; }
            .assign-card h1 { font-size: 24px; }
            .buttons { flex-direction: column; }
        }

        @media (prefers-reduced-motion: reduce) {
            .assign-card { animation: none; }
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

    <main class="assign-page">
    <section class="card assign-card">

        <h1>Assign Teacher</h1>

        <div class="course-info">
            <b>Course:</b> {{ course.course_code }} - {{ course.course_name }} <br>
            <b>Class:</b> {{ course.academic_class.name }}
        </div>

        <form method="post">
            {% csrf_token %}

            <label for="teacher-select">Select Faculty / HOD</label>

            <select id="teacher-select" name="teacher" required>
                <option value="">-- Select Faculty --</option>
                {% for teacher in teachers %}
                <option value="{{ teacher.id }}" {% if course.faculty and course.faculty.id == teacher.id %} selected {% endif %}>
                    {{ teacher.get_full_name|default:teacher.username }}
                    {% if teacher.role == "HOD" %} (HOD){% endif %}
                </option>
                {% endfor %}
            </select>

            <div class="buttons">
                <button type="submit" class="btn btn-primary">Assign</button>
                <a href="{% url 'class_dashboard' course.academic_class.id %}" class="cancel-link">Cancel</a>
            </div>
        </form>

    </section>
    </main>

</body>
</html>
