<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>

    <link rel="stylesheet" href="/static/css/site.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f5f8ff;
            --surface: #fff;
            --border: #e5eaf2;
            --ink: #17243b;
            --muted: #78869b;
            --blue: #245eea;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0 !important;
            padding: 40px 24px !important;
            background: radial-gradient(ellipse at 86% 5%, rgba(196, 218, 255, .36), transparent 32%), var(--page-bg) !important;
            color: var(--ink) !important;
            font-family: "DM Sans", "Segoe UI", sans-serif !important;
        }

        .create-course-page {
            width: min(760px, 100%);
            margin: 0 auto;
        }

        .create-course-card {
            padding: 38px !important;
            border: 1px solid var(--border) !important;
            border-radius: 18px !important;
            background: var(--surface) !important;
            box-shadow: 0 18px 48px rgba(34, 57, 97, .09) !important;
            animation: arrive .45s ease-out both;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .create-course-card h1 {
            margin: 0 0 28px;
            color: var(--ink) !important;
            font: 800 28px/1.25 "Manrope", sans-serif;
            text-align: center;
        }

        .class-info {
            margin-bottom: 28px;
            padding: 16px 18px;
            border: 1px solid #e4ebf7;
            border-radius: 10px;
            background: #f7f9fd;
            color: #34435b;
            font-size: 15px;
            line-height: 1.8;
        }

        .class-info b { color: var(--blue); }

        .create-course-card form p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 13px;
        }

        .create-course-card label {
            display: block;
            margin-bottom: 8px;
            color: #45546c;
            font-size: 14px;
            font-weight: 700;
        }

        .create-course-card input,
        .create-course-card select,
        .create-course-card textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d9e2ef !important;
            border-radius: 8px !important;
            background: #fff !important;
            color: var(--ink) !important;
            font: 500 15px "DM Sans", sans-serif;
        }

        .create-course-card textarea {
            min-height: 110px;
            resize: vertical;
        }

        .create-course-card .helptext {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .create-course-card .errorlist {
            margin: 0 0 8px;
            padding-left: 18px;
            color: #b42318;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .create-course-page .save-btn,
        .create-course-page .cancel-btn {
            min-height: 44px;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: 9px;
            font: 700 14px "DM Sans", sans-serif;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
        }

        .create-course-page .save-btn {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 5px 13px rgba(36, 94, 234, .18);
        }

        .create-course-page .save-btn:hover {
            background: #1747bf;
            box-shadow: 0 8px 18px rgba(36, 94, 234, .22);
        }

        .create-course-page .cancel-btn {
            border-color: #d9e2ef;
            background: #fff;
            color: #45546c;
        }

        .create-course-page .cancel-btn:hover { background: #f5f7fb; }
        .create-course-page .save-btn:hover,
        .create-course-page .cancel-btn:hover { transform: translateY(-1px); }

        @media (max-width: 520px) {
            body { padding: 20px 14px !important; }
            .create-course-card { padding: 24px 18px !important; }
            .create-course-card h1 { font-size: 24px; }
            .buttons { flex-direction: column; }
        }

        @media (prefers-reduced-motion: reduce) {
            .create-course-card { animation: none; }
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

    <main class="create-course-page">
    <section class="card create-course-card">

        <h1>Create Course</h1>

        <div class="class-info">
            <b>Class:</b> {{ academic_class.name }} <br>
            <b>Semester:</b> {{ academic_class.semester }} <br>
            <b>Academic Year:</b> {{ academic_class.academic_year }}
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="buttons">
                <button type="submit" class="save-btn">Save Course</button>
                <a href="{% url 'class_dashboard' academic_class.id %}" class="cancel-btn">Cancel</a>
            </div>
        </form>

    </section>
    </main>

</body>
</html>
