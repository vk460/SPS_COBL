<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}COBL System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}
    <style>
   /* GLOBAL */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Poppins, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, .16), transparent 28%),
                linear-gradient(135deg, #0f172a, #164e63 52%, #1e293b);
            min-height: 100vh;
            color: #fff;
            padding-bottom: 40px;
        }

        /* NAVBAR */

        .navbar {
            width: 100%;
            background: rgba(15, 23, 42, .72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
        }

        .navbar h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #e5e7eb;
            font-weight: 500;
            transition: .3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* CONTAINER */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
            animation: fadeUp .7s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SECTIONS */

        .section {
            background: rgba(255, 255, 255, .10);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .45);
        }

        /* HEADINGS */

        h2,
        h3 {
            margin-bottom: 15px;
        }

        /* TABLE */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, .2);
        }

        th {
            background: rgba(255, 255, 255, .15);
            font-weight: 600;
        }

        tbody tr {
            transition: .2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, .12);
            transform: scale(1.01);
        }

        /* AVERAGE ROW */

        .avg-row {
            background: #0891b2;
            font-weight: bold;
            color: white;
        }

        /* BUTTONS */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 36px;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            line-height: 1.2;
            text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, .3);
        }

        .btn:focus-visible,
        .action-links a:focus-visible,
        .nav-links a:focus-visible {
            outline: 3px solid rgba(56, 189, 248, .55);
            outline-offset: 3px;
        }

        .btn:active,
        .action-links a:active {
            transform: translateY(0);
        }

        .create-btn {
            background: #22c55e;
            color: #052e16;
        }

        /* LINKS */

        .action-links {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .action-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 16px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }

        .action-links a:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        /* MOBILE */

        @media(max-width:768px) {

            .navbar {
                padding: 12px 20px;
            }

            .navbar h1 {
                font-size: 16px;
            }

            .nav-links {
                display: none;
            }

            .container {
                padding: 20px 15px;
            }

            .section {
                padding: 20px;
            }

            table {
                font-size: 13px;
            }

        }
                .value-1{
        background:#3A5661;
        color:#ffed2b;
        font-weight:600;
        }

        .value-2{
        background:#3A5661;
        color:#ff3737;
        font-weight:600;
        }

        .value-3{
        background:#3A5661;
        color:#1eff40;
        font-weight:600;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>

    <!-- Navbar (shared across pages) -->
    <div class="navbar">
        <h1>COBL System</h1>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <!-- Add more shared links if needed -->
        </div>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% block extra_js %}{% endblock %}

</body>
</html>
